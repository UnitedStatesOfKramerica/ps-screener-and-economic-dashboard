name: Market check + capital allocation backtest (one-off)

# Manual-trigger only. Runs market_check_backtest.py once and captures its
# output in the Actions log. Delete this file and market_check_backtest.py
# once we've read the output. This fetches ~71 series (roughly double the
# regime backtest) so timeout is set generously.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests xlrd yfinance openpyxl

      - name: Run market check + allocation backtest
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python market_check_backtest.py
