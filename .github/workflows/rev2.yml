name: Build rev2 fixture

on:
  workflow_dispatch:

jobs:
  rev2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests pandas numpy yfinance lxml
      - name: Probe the revenue faults, untrimmed
        env:
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
        run: python build_rev2_fixture.py
      - uses: actions/upload-artifact@v4
        with:
          name: rev2
          path: rev2.json.gz
          retention-days: 14
          if-no-files-found: error
