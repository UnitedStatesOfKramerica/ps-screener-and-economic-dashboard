name: Regime persistence backtest (one-off)

# Manual-trigger only. Runs regime_persistence.py once and captures output in
# the Actions log. Delete this file and regime_persistence.py once we've read
# the output. Timeout raised to 45 min: the signal set grew from ~20 to ~31
# series, so this run is meaningfully heavier than the previous one.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests xlrd yfinance openpyxl

      - name: Run regime persistence backtest
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python regime_persistence.py
