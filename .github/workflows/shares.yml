name: Build shares fixture

# Manual only. Reads EDGAR, prints a table, leaves a file to download.
# Writes nothing back and does not touch the nightly run's cache.
on:
  workflow_dispatch:

jobs:
  shares:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests pandas numpy yfinance lxml

      - name: Probe the share concepts
        env:
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
        run: python build_shares_fixture.py

      - uses: actions/upload-artifact@v4
        with:
          name: shares
          path: shares.json.gz
          retention-days: 14
          if-no-files-found: error
