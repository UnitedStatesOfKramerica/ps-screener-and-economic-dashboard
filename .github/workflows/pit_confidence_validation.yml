name: Point-in-time confidence validation (one-off)

# Manual-trigger only. Runs pit_confidence_validation.py once and captures its
# output in the Actions log. Delete this file and pit_confidence_validation.py
# once we've read the output. Imports alfred_deep and macro_dashboard, so both
# must be present in the repo. Heavy on ALFRED API calls (one round per month
# over ~28 years) -- longer timeout.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests yfinance

      - name: Run point-in-time confidence validation
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python pit_confidence_validation.py
