name: ALFRED point-in-time check

# Run manually from the Actions tab. Prints its report to the build log -- it
# publishes nothing. It makes ~350 vintage API calls, so give it a few minutes,
# then copy the log output back to compare against the (revised) Historical check.
on:
  workflow_dispatch:

jobs:
  alfred:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests

      - name: Run ALFRED point-in-time check
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python alfred_check.py
