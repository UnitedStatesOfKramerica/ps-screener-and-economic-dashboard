name: Build macro dashboard

# FRED updates weekly/monthly, so once a day is plenty. Runs at 21:00 UTC, an
# hour before the nightly screener, so the two never publish at the same moment.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # xlrd reads Shiller's ie_data.xls for CAPE; openpyxl reads FINRA's
      # margin-statistics.xlsx for margin debt; yfinance fetches RSP/SPY for
      # the concentration ratio. All three fail soft (their fetch functions
      # catch and skip), so a broken install or fetch doesn't take down the
      # rest of the build -- but note this workflow was previously missing
      # openpyxl entirely, which is why margin debt has been silently failing
      # ("openpyxl not installed -- skipping margin debt") since this was built.
      - run: pip install requests xlrd yfinance openpyxl

      - name: Build the dashboard
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python macro_dashboard.py

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard.html
          if git diff --staged --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Macro dashboard $(date -u +%Y-%m-%d)"
          # Rebase onto whatever landed on main since this job checked out --
          # e.g. a manual file upload while the run was in flight. Only
          # docs/dashboard.html is touched here, so this should always apply
          # cleanly; if it ever doesn't, the job fails loudly instead of
          # silently losing today's update.
          git fetch origin main
          git rebase origin/main
          git push
