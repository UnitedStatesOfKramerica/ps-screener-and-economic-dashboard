# Build the point-in-time quality history, and run the real-data checks on the corrected screener.
#
# A one-off, manually started run. In order, on GitHub's machines (which can reach
# the SEC and Yahoo), each as its own step so the Actions page shows which passed:
#
#   1-3  your replay checks and unit tests on the corrected ps_screener.py, with a
#        real-filings fixture built here (the repo never commits one)
#   4    does the first intraday refresh reproduce the nightly page when no price has
#        moved? -- on real data, every column the refresh recomputes
#   5    the research figures behind the quality score, rebuilt as they stood on every
#        past filing date using only what had been filed by then, plus a self-check
#        of that replay against what the nightly published today
#
# Everything comes back as ONE downloadable artifact named "quality-history".
# Commits nothing, publishes nothing, cannot touch the live screen: permissions are
# read-only, and every file this writes lands in this run's throwaway copy of the repo.

name: Quality history

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install libraries
        run: |
          pip install -r requirements.txt || echo "requirements.txt did not fully install; filling gaps below"
          pip install yfinance pandas numpy requests lxml
          mkdir -p backtest_data

      - name: 1. Build the real-filings fixture your replay checks need
        continue-on-error: true
        timeout-minutes: 20
        env:
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
        run: |
          python - <<'FIXTURE'
          """
          Build the real-filings fixture replay.py reads -- the file the repo never
          commits -- using the screener's OWN SEC client and price loader, so the facts
          and prices are exactly what the nightly sees. Shape, per ticker, as replay.py's
          load()/series()/run_one() expect:
              {"facts": <companyfacts>, "prices": {"YYYY-MM-DD": close}, "splits": {...}}

          Companies: replay.py's own -- the eight assert_real_data() checks, plus every
          name in its SECTOR map (the quality table). Written to
          backtest_data/replay_fixture.json.gz, then read back before it is trusted.
          """
          import gzip
          import json
          import os
          from datetime import date, timedelta
          from pathlib import Path

          import pandas as pd
          import ps_screener as ps

          OUT = Path("backtest_data")
          OUT.mkdir(exist_ok=True)
          TICKERS = ["HON", "MNST", "AMD", "BG", "AON", "ADM", "DD", "CPT",          # assert_real_data
                     "OXY", "DVN", "MSFT", "V", "PG", "VZ", "CAT", "INTC", "CRM",     # SECTOR map
                     "MCD", "MTD", "JPM", "O"]

          edgar = ps.Edgar(os.environ.get("SEC_EMAIL", ""))
          cik = edgar.ticker_to_cik()
          # Same start the nightly asks for at its default history length.
          closes, splits = ps.fetch_prices(
              TICKERS, date.today() - timedelta(days=365 * ps.HISTORY_YEARS + 400))

          bundle, skipped = {}, []
          for t in TICKERS:
              facts = edgar.company_facts(cik[t]) if t in cik else None
              if not facts or t not in closes:
                  skipped.append(f"{t} ({'no filings' if not facts else 'no prices'})")
                  continue
              sp = splits.get(t)
              bundle[t] = {
                  "facts": facts,
                  "prices": {str(pd.Timestamp(k).date()): float(v) for k, v in closes[t].items()},
                  "splits": {str(pd.Timestamp(k).date()): float(v)
                             for k, v in (sp.items() if sp is not None else [])},
              }

          path = OUT / "replay_fixture.json.gz"
          with gzip.open(path, "wt") as fh:
              json.dump(bundle, fh)
          with gzip.open(path, "rt") as fh:                     # read back before trusting it
              back = json.load(fh)
          assert set(back) == set(bundle), "fixture did not read back intact"
          print(f"replay fixture: {len(back)} companies ({', '.join(back)}); "
                f"skipped: {', '.join(skipped) or 'none'}; {path.stat().st_size / 1e6:.1f} MB")
          FIXTURE

      - name: 2. Run your replay checks on the corrected screener
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          export QS_FIXTURE=backtest_data/replay_fixture.json.gz
          {
            echo "---------- replay.py: the table ----------"
            python replay.py
            echo
            echo "---------- replay.py: the checks against real filings ----------"
            python - <<'REPLAYCHECKS'
          """
          Run replay.py's real-filings checks, without letting one company that has no
          usable history stop the rest.

          assert_real_data() builds each company's history and goes straight on to use it.
          For a company the screener cannot build one for today -- Bunge, which re-registered
          with the SEC under a new number and so has almost no filing history under it --
          the history comes back empty and the check dies with a KeyError before reaching
          the companies after it. Those companies are reported here by name and left out of
          the run; the checks that CAN run still run, and replay.py itself is untouched.
          """
          import sys

          import replay

          bundle = replay.load()
          unusable = []
          for t, d in bundle.items():
              try:
                  h = replay.run_one(t, d)["hist"]
                  if h is None or h.empty:
                      unusable.append(t)
              except Exception as e:
                  unusable.append(t)
                  print(f"  {t}: the screener's own pipeline raised {type(e).__name__}: {str(e)[:100]}")

          if unusable:
              print("*" * 78)
              print("NOT CHECKED -- the screener builds no usable history for these today, so a")
              print("check of their share-count or revenue handling has nothing to run on:")
              print("    " + ", ".join(unusable))
              print("(Bunge, Visa and the other reorganised or per-class filers: see the list of")
              print("companies missing from the screen. Their checks return when that is fixed.)")
              print("*" * 78)
              _orig = replay.load
              replay.load = lambda path=None, _o=_orig, _skip=tuple(unusable): {
                  k: v for k, v in _o(path).items() if k not in _skip}

          sys.exit(0 if replay.assert_real_data() else 1)
          REPLAYCHECKS
          } 2>&1 | tee backtest_data/replay_output.txt

      - name: 3. Run your unit tests (test_current_build.py)
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          if [ -f test_current_build.py ]; then
            python test_current_build.py 2>&1 | tee backtest_data/unit_tests_output.txt
          else
            echo "test_current_build.py is not in the repo root" | tee backtest_data/unit_tests_output.txt
            exit 1
          fi

      - name: 4. Check the intraday refresh against the nightly on real data
        continue-on-error: true
        timeout-minutes: 40
        shell: bash
        env:
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
        run: |
          # A full nightly-style pass under its own tag (writes ps_screen_chk.* and
          # docs/state_chk.json in this throwaway checkout; the real files are untouched).
          # --verify 5: cross-check five rows against Yahoo, as the earlier export did.
          python ps_screener.py --tag chk --verify 5 > backtest_data/nightly_chk_log.txt 2>&1 \
            || echo "::warning::the screener pass ended with an error; checking whatever it wrote"
          tail -25 backtest_data/nightly_chk_log.txt
          cat > check_z_consistency.py <<'ZCHECK'
          """
          Does the first intraday refresh change anything when no price has moved?

          It must not. A refresh that moves a stock's Z-score, percentile or Opportunity
          while its price is unchanged is showing the reader a difference that does not
          exist -- and Opportunity is the default sort, so it reorders the page. This
          exercises the REAL nightly output and the REAL refresh_prices() on real data:

            1. the nightly pass wrote ps_screen<tag>.csv and docs/state<tag>.json
            2. refresh_prices() is run with every price held at exactly last night's close
            3. every column it recomputes is compared, company by company

          Only the price feed is replaced (to hold prices still); nothing else is touched.
          Usage:  python check_z_consistency.py _chk
          """
          import json
          import math
          import sys
          from pathlib import Path

          import numpy as np
          import pandas as pd

          import ps_screener as ps

          TAG = sys.argv[1] if len(sys.argv) > 1 else "_chk"
          OUT = Path("backtest_data")
          OUT.mkdir(exist_ok=True)

          # column: (kind, tolerance). "abs" = absolute difference, "rel" = relative.
          # Tolerances sit just above the rounding that saving the history to 6 decimals
          # introduces (about one observation in 2,500 on the percentile) and well below
          # anything a reader could see: the page shows the percentile as a whole number.
          CHECKS = {
              "zscore": ("abs", 1e-4), "percentile": ("abs", 0.1),
              "vs_10y_pct": ("abs", 0.01), "vs_5y_pct": ("abs", 0.01),
              "ps_med_10y": ("rel", 1e-5), "ps_med_5y": ("rel", 1e-5),
              "ps_min": ("rel", 1e-5), "ps_max": ("rel", 1e-5),
              "ps_now": ("rel", 1e-9), "opportunity": ("abs", 0.0),
          }

          state_path = Path(f"docs/state{TAG}.json")
          csv_path = Path(f"ps_screen{TAG}.csv")
          if not state_path.exists() or not csv_path.exists():
              sys.exit(f"Missing {state_path} or {csv_path}: run `python ps_screener.py --tag {TAG.lstrip('_')}` first.")

          state = json.loads(state_path.read_text())
          before = pd.read_csv(csv_path).set_index("ticker")
          last = {t: c["last_price"] for t, c in state["companies"].items()}

          # Hold every price exactly where the nightly left it.
          ps._latest_prices = lambda tickers: ({t: last[t] for t in tickers if t in last},
                                               {t: last[t] for t in tickers if t in last})
          ps.refresh_prices(TAG)
          after = pd.read_csv(csv_path).set_index("ticker")

          lines = [f"Z-CONSISTENCY ON REAL DATA: nightly output vs first intraday refresh, prices held still",
                   f"state built {state.get('built')}; {len(before)} companies in the nightly output, "
                   f"{len(after)} after the refresh", ""]
          common = before.index.intersection(after.index)
          lines.append(f"{'column':<13}{'compared':>9}{'max difference':>17}{'over tolerance':>16}")
          failed = []
          for col, (kind, tol) in CHECKS.items():
              if col not in before or col not in after:
                  lines.append(f"{col:<13}{'(column missing)':>42}")
                  failed.append(col)
                  continue
              b = pd.to_numeric(before.loc[common, col], errors="coerce")
              a = pd.to_numeric(after.loc[common, col], errors="coerce")
              both = b.notna() & a.notna()
              one_sided = int((b.notna() ^ a.notna()).sum())     # present before, absent after (or vice versa)
              d = (a[both] - b[both]).abs()
              if kind == "rel":
                  d = d / b[both].abs().clip(lower=1e-12)
              over = d[d > tol]
              worst = f"{d.max():.2e}" if len(d) else "n/a"
              lines.append(f"{col:<13}{int(both.sum()):>9}{worst:>17}{len(over) + one_sided:>16}"
                           + (f"   ({one_sided} appeared/vanished)" if one_sided else ""))
              if len(over) or one_sided:
                  failed.append(col)
                  for t in list(over.sort_values(ascending=False).index[:6]):
                      lines.append(f"      {t:<6} before {b[t]:.6g}  after {a[t]:.6g}")

          lines.append("")
          lines.append("RESULT: " + ("PASS -- the refresh reproduces the nightly page exactly while prices are still"
                                     if not failed else f"FAIL -- these columns moved with no price change: {', '.join(failed)}"))
          text = "\n".join(lines)
          print(text)
          (OUT / "z_consistency_report.txt").write_text(text + "\n")
          sys.exit(1 if failed else 0)
          ZCHECK
          python check_z_consistency.py _chk

      - name: 5. Rebuild the quality figures as they stood on every past filing date
        continue-on-error: true
        timeout-minutes: 150
        shell: bash
        env:
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
        run: |
          cat > pit_core.py <<'PITCORE'
          """
          Point-in-time replay of the screener's research figures.

          For one company and one past date, rebuild what the screener WOULD have computed
          using only what had been filed by that date -- by running the screener's own
          functions (collect_periods, derive_quarters, trailing_twelve, collect_instants,
          monthly_ps, research) on SEC facts filtered by their `filed` date. Nothing is
          re-implemented except the three places where main() compares against today's
          date, which here compare against the replay date instead:

            * share-count selection and its staleness test   (main(), lines ~5126-5143)
            * _instant_at(), the "value N years ago" lookup   (research(), current_ratio_3y)
            * monthly_ps's history window, which is anchored on today (so a very long
              window is passed and the price series is cut at the replay date instead)

          Quality itself is NOT computed here. It is a pure function of these figures (plus
          a dividend yield), so it is scored afterwards with the screener's own
          quality_score(); that way the pillar formulas can be varied without re-reading
          the SEC. Everything in a returned record was knowable on its `asof` date.
          """
          import math
          from datetime import date, timedelta

          import numpy as np
          import pandas as pd

          import ps_screener as ps

          PERIODIC = ("10-K", "10-Q", "10-K/A", "10-Q/A", "20-F")
          HIST_YEARS = 40            # monthly_ps window: far longer than any price history here
          PRICE_LOOKBACK_YEARS = 8   # dilution looks back 5y; the extra covers split detection
          _ASOF = {"d": None}        # the replay date, read by the patched _instant_at


          def naive(s):
              """A price or split series with a timezone-free daily index. Newer yfinance can
              return tz-aware dates; comparing those with a plain Timestamp raises, and
              monthly_ps does its own normalisation, so do the same here once, up front."""
              if s is None:
                  return None
              idx = pd.to_datetime(s.index)
              if getattr(idx, "tz", None) is not None:
                  idx = idx.tz_localize(None)
              out = s.copy()
              out.index = pd.DatetimeIndex(idx).normalize()
              return out[~out.index.duplicated(keep="last")].sort_index()


          def to_date(x):
              return x if isinstance(x, date) and not isinstance(x, pd.Timestamp) else pd.Timestamp(x).date()


          def facts_asof(facts: dict, asof: str) -> dict:
              """The filings as they stood on `asof` (a 'YYYY-MM-DD' string): every fact row
              filed after it is removed, original row order preserved. Rows first reported
              later, restatements filed later and later-filed comparatives all vanish, which
              is exactly the information set a person looking on that day would have had."""
              out = {"facts": {}}
              for taxonomy, concepts in (facts.get("facts") or {}).items():
                  kept = {}
                  for name, entry in concepts.items():
                      units = {}
                      for unit, rows in (entry.get("units") or {}).items():
                          keep = [r for r in rows if (r.get("filed") or "") <= asof]
                          if keep:
                              units[unit] = keep
                      if units:
                          e = dict(entry)
                          e["units"] = units
                          kept[name] = e
                  if kept:
                      out["facts"][taxonomy] = kept
              return out


          def filing_dates(facts: dict, start: str = "0000-00-00") -> list[str]:
              """Every distinct date a periodic report reached the SEC -- the dates on which
              the picture of the company could have changed."""
              seen = set()
              for concepts in (facts.get("facts") or {}).values():
                  for entry in concepts.values():
                      for rows in (entry.get("units") or {}).values():
                          for r in rows:
                              if r.get("form") in PERIODIC and r.get("filed"):
                                  seen.add(r["filed"])
              return sorted(d for d in seen if d >= start)


          def pick_shares(facts: dict, asof: date):
              """main()'s share selection, with the staleness test measured from the replay
              date. Same priority order, same units repair, same backward splice."""
              shares, src = None, None
              for concept in ps.SHARE_MARKETCAP_TAGS:
                  got = ps.collect_instants(facts, "us-gaap", [concept])
                  if got and (asof - got[-1][0]).days <= ps.SHARE_STALE_DAYS:
                      shares, src = got, concept
                      break
              if shares is not None:
                  shares = ps._correct_units_error(shares, facts)
                  shares = ps._splice_share_history(shares, src, facts)
              if shares is None:
                  dei = ps.collect_instants(facts, "dei", ps.SHARE_TAGS_DEI)
                  if dei and (asof - dei[-1][0]).days <= ps.SHARE_STALE_DAYS:
                      shares, src = dei, "dei:EntityCommonStockSharesOutstanding"
              ps.CURRENT_SHARE_SRC = src
              return shares, src


          def _instant_at_asof(facts: dict, tags: list, years_ago: float):
              pts = ps.collect_instants(facts, "us-gaap", tags)
              if not pts:
                  return None
              target = _ASOF["d"] - timedelta(days=int(365.25 * years_ago))
              older = [(d0, v) for d0, v in pts if d0 <= target]
              return older[-1][1] if older else None


          ps._instant_at = _instant_at_asof     # research() looks this up by name at call time


          def replay_one(ticker: str, facts: dict, closes: pd.Series, splits, sector: str,
                         asof: str, filter_facts: bool = True, production_window: int | None = None) -> dict:
              """One company on one date. Returns a flat record; `status` says whether the
              screener would have produced a row at all that day."""
              asof_d = date.fromisoformat(asof)
              _ASOF["d"] = asof_d
              ps.CURRENT_TICKER = ticker
              rec = {"ticker": ticker, "asof": asof, "sector": sector}
              f = facts_asof(facts, asof) if filter_facts else facts

              periods = ps.collect_periods(f, "us-gaap", ps.REVENUE_TAGS)
              quarters = ps.derive_quarters(periods)
              ttm = ps.trailing_twelve(quarters, periods)
              if ttm.empty or len(ttm) == 0:
                  rec["status"] = "no_revenue"
                  return rec
              shares, src = pick_shares(f, asof_d)
              if shares is None:
                  rec["status"] = "no_shares"
                  return rec
              rec["share_src"] = src

              ts = pd.Timestamp(asof)
              px = closes[closes.index <= ts]
              if production_window is None:
                  px = px[px.index >= ts - pd.DateOffset(years=PRICE_LOOKBACK_YEARS)]
                  years = HIST_YEARS
              else:
                  years = production_window
              sp = None
              if splits is not None and len(splits):
                  sp = splits[splits.index <= ts]
                  sp = sp if len(sp) else None
              hist = ps.monthly_ps(px, ttm, shares, sp, years)
              rec["hist_ok"] = bool(hist is not None and not hist.empty)
              if not rec["hist_ok"]:
                  hist = None
              # mktcap is deliberately NOT passed: Yahoo back-adjusts prices for splits that
              # happen AFTER the replay date, so price x as-reported shares would be wrong
              # for any company that later split. Nothing in the quality score reads it.
              try:
                  rs = ps.research(ticker, f, hist, ttm, None, sector=sector)
              except Exception as e:                                     # main() does the same
                  rec["status"] = "research_failed"
                  rec["error"] = str(e)[:120]
                  return rec
              rs.pop("ticker", None)
              rec.update(rs)
              rec["status"] = "ok"
              rec["last_filed"] = asof
              rec["ttm_rev_b"] = round(float(ttm["ttm"].iloc[-1]) / 1e9, 3)
              rec["ttm_period_end"] = str(pd.Timestamp(ttm["period_end"].iloc[-1]).date())
              return rec
          PITCORE
          cat > build_pit_quality.py <<'PITRUN'
          """
          Point-in-time research history: the driver. Runs on GitHub's machines.

          For every company in the published screen, replay the screener's own research
          pipeline at every date a periodic report reached the SEC (pit_core.replay_one),
          using only what had been filed by that date. Output is one row per
          (company, filing date): exactly the figures quality_score() reads, as they were
          knowable then. Scoring is done afterwards, offline, with the screener's own
          quality_score(), so the pillar formulas can be varied without re-reading the SEC.

          It also checks itself. The same replay is run for TODAY on the unfiltered
          filings and compared with what the nightly run published (docs/state.json): the
          research figures, the quality score and all four pillars. If the replay and the
          production code disagree about the present, nothing it says about the past can
          be trusted, so that comparison is written to the report first.

          Writes, in backtest_data/:
            pit_research.csv.gz   one row per company per filing date (status, every research figure)
            pit_validation.csv    replay-vs-production, per company, for today
            pit_report.txt        counts, coverage by year, validation headline, timing
          """
          import json
          import math
          import os
          import sys
          import time
          from datetime import date
          from multiprocessing import Pool, TimeoutError as MPTimeout
          from pathlib import Path

          import numpy as np
          import pandas as pd

          import ps_screener as ps
          import pit_core as pc

          OUT = Path("backtest_data")
          OUT.mkdir(exist_ok=True)
          FIRST_ASOF = "2013-06-01"        # a few months before the first Z can exist (~Oct 2014)
          PRICE_START = date(2005, 1, 1)   # eight years of prices ahead of the earliest replay date
          TODAY = date.today().isoformat()
          WORKERS = int(os.environ.get("PIT_WORKERS") or min(4, os.cpu_count() or 1))
          DEADLINE_S = float(os.environ.get("PIT_DEADLINE_MIN", "110")) * 60
          COMPARE = ["net_income_b", "net_margin", "roe", "net_debt_b", "debt_b", "fcf_b", "fcf_margin",
                     "debt_to_equity", "current_ratio", "net_debt_to_sales", "equity_b",
                     "revenue_cagr_3y", "revenue_cagr_5y", "income_cagr_3y", "income_cagr_5y",
                     "dilution_1y", "dilution_3y", "dilution_5y"]
          PILLARS = ["quality", "q_balance", "q_profit", "q_traj", "q_cash"]
          report: list[str] = []


          def say(msg=""):
              print(msg, flush=True)
              report.append(str(msg))


          def missing(v):
              return v is None or (isinstance(v, float) and math.isnan(v)) or (isinstance(v, str) and v == "")


          def same(a, b):
              if missing(a) and missing(b):
                  return True
              if missing(a) or missing(b):
                  return False
              try:
                  return math.isclose(float(a), float(b), rel_tol=1e-6, abs_tol=1e-9)
              except (TypeError, ValueError):
                  return a == b


          # ---- universe: exactly the companies the nightly publishes --------------------
          sp_path = Path("docs/state.json")
          if not sp_path.exists():
              sys.exit("docs/state.json not found -- the nightly run has to have published once.")
          state = json.loads(sp_path.read_text())
          built = state.get("built")
          prod = {t: c["row"] for t, c in state["companies"].items()}
          say(f"production state built {built}: {len(prod)} published companies")
          say(f"python {sys.version.split()[0]}, pandas {pd.__version__}, numpy {np.__version__}, {WORKERS} worker(s)")

          edgar = ps.Edgar(os.environ.get("SEC_EMAIL", ""))
          cik_map = edgar.ticker_to_cik()
          tickers = sorted(t for t in prod if t in cik_map)
          say(f"{len(tickers)} map to an SEC registrant")

          # refresh=True: ignore any price cache an earlier step in this run wrote. The nightly
          # pass keeps only ~12 years, and a replay of 2013-2016 needs the earlier prices; a
          # cache hit would silently skip them and shorten every early dilution window.
          closes, splits = ps.fetch_prices(tickers, PRICE_START, refresh=True)
          closes = {t: pc.naive(s) for t, s in closes.items()}
          splits = {t: pc.naive(s) for t, s in splits.items()}
          no_px = [t for t in tickers if t not in closes]
          say(f"prices for {len(tickers) - len(no_px)} of {len(tickers)}"
              + (f"; none for: {', '.join(no_px)}" if no_px else ""))

          FACTS: dict[str, dict] = {}
          t0 = time.time()
          for i, t in enumerate(tickers, 1):
              if t in closes:
                  f = edgar.company_facts(cik_map[t])
                  if f:
                      FACTS[t] = f
              if i % 50 == 0:
                  print(f"  filings {i}/{len(tickers)}  ({time.time() - t0:.0f}s)", flush=True)
          work_list = [t for t in tickers if t in FACTS]
          say(f"filings for {len(work_list)} companies ({time.time() - t0:.0f}s)")
          if len(work_list) < 0.9 * len(prod):
              (OUT / "pit_report.txt").write_text("\n".join(report))
              sys.exit(f"Only {len(work_list)} of {len(prod)} companies have both prices and filings; "
                       "refusing to continue on a gutted universe.")


          # ---- the replay, in parallel (forked workers share FACTS/closes without copying) --
          def work(t):
              try:
                  ps.REJECTED_RATIOS.clear()
                  ps.CONCEPT_TRACE.clear()
                  rows = [pc.replay_one(t, FACTS[t], closes[t], splits.get(t),
                                        (prod[t].get("sector") or ""), f)
                          for f in pc.filing_dates(FACTS[t], FIRST_ASOF)]
                  return t, rows, None
              except Exception as e:
                  return t, [], f"{type(e).__name__}: {str(e)[:160]}"


          records, errors, done = [], [], 0
          start = time.time()
          partial = False
          say(f"\nreplaying {len(work_list)} companies on {WORKERS} worker(s), first date {FIRST_ASOF}")
          # The deadline is checked on a timer, not only when a result arrives: a worker killed
          # from outside (out of memory, say) loses its task silently and imap_unordered would
          # then wait forever, and the step's own timeout would discard everything unwritten.
          with Pool(WORKERS) as pool:
              it = pool.imap_unordered(work, work_list, chunksize=1)
              while done < len(work_list):
                  try:
                      t, rows, err = it.next(timeout=30)
                  except MPTimeout:
                      if time.time() - start > DEADLINE_S:
                          partial = True
                          break
                      continue
                  except StopIteration:
                      break
                  done += 1
                  records.extend(rows)
                  if err:
                      errors.append((t, err))
                  if done % 20 == 0 or done == len(work_list):
                      el = time.time() - start
                      print(f"  {done}/{len(work_list)} companies, {len(records):,} rows, {el / 60:.1f} min, "
                            f"~{el / done * (len(work_list) - done) / 60:.1f} min left", flush=True)
                  if time.time() - start > DEADLINE_S:
                      partial = True
                      break
              if partial or done < len(work_list):
                  partial = True
                  pool.terminate()
          replay_min = (time.time() - start) / 60
          say(f"replay finished in {replay_min:.1f} min" + ("  ** PARTIAL: hit the time limit **" if partial else ""))
          if errors:
              say(f"{len(errors)} companies raised an error: " + "; ".join(f"{t}: {e}" for t, e in errors[:8]))

          df = pd.DataFrame(records)
          lead = [c for c in ["ticker", "asof", "status", "sector"] if c in df.columns]
          df = df[lead + [c for c in df.columns if c not in lead]].sort_values(["ticker", "asof"]).reset_index(drop=True)

          # quality WITHOUT the dividend bonus, from the screener's own function. (The bonus
          # reads Yahoo's yield *today*, which has no point-in-time value; it is added back
          # offline from the dividend history.)
          ok = df["status"] == "ok"
          if ok.any():
              sc = ps.quality_score(df.loc[ok].copy())
              for c in PILLARS:
                  df.loc[ok, c + "_nodiv"] = pd.to_numeric(sc[c], errors="coerce").values
          df.to_csv(OUT / "pit_research.csv.gz", index=False)
          back = pd.read_csv(OUT / "pit_research.csv.gz", usecols=["ticker", "status"])
          assert len(back) == len(df), "pit_research.csv.gz did not read back intact"

          say("\nROWS BY STATUS (a row is one company on one filing date)")
          for k, v in df["status"].value_counts().items():
              say(f"  {k:16s} {v:>7,}")
          if "quality_nodiv" in df:
              say(f"  rows with a quality score (no dividend bonus): {int(df['quality_nodiv'].notna().sum()):,}")

          say("\nCOVERAGE: companies with a quality score, as of each year-end (latest filing on or before it)")
          dd = df[df["status"] == "ok"].copy()
          for y in range(2014, 2027):
              cut = f"{y}-12-31" if y < 2026 else TODAY
              last = dd[dd["asof"] <= cut].sort_values("asof").groupby("ticker").tail(1)
              say(f"  {cut}: {int(last['quality_nodiv'].notna().sum()):>4} scored of {last['ticker'].nunique():>4} with a row")

          (OUT / "pit_report.txt").write_text("\n".join(report) + "\n")     # keep what we have if the self-check fails

          # ---- self-check: today's replay vs what production published -------------------
          say(f"\nVALIDATION: replay of TODAY vs the {built} production run, on the same pipeline")
          try:
              vrows = []
              for t in work_list:
                  p = prod[t]
                  rec = pc.replay_one(t, FACTS[t], closes[t], splits.get(t), (p.get("sector") or ""), TODAY,
                                      filter_facts=False, production_window=ps.HISTORY_YEARS)
                  row = dict(rec)
                  row["dividend_yield"] = p.get("dividend_yield")        # production's own input, to compare like with like
                  q = ps.quality_score(pd.DataFrame([row])).iloc[0]
                  v = {"ticker": t, "status": rec["status"],
                       "new_filing_since_build": bool(built and pc.filing_dates(FACTS[t], built))}
                  bad = []
                  for c in PILLARS:
                      v["prod_" + c], v["replay_" + c] = p.get(c), q.get(c)
                      if not same(p.get(c), q.get(c)):
                          bad.append(c)
                  for c in COMPARE:
                      if not same(p.get(c), rec.get(c)):
                          bad.append(c)
                  v["fields_differing"] = ",".join(bad)
                  vrows.append(v)
              vd = pd.DataFrame(vrows)
              vd.to_csv(OUT / "pit_validation.csv", index=False)
              clean = vd[~vd["new_filing_since_build"]]
              exact = clean[clean["fields_differing"] == ""]
              say(f"  {len(vd)} companies; {len(vd) - len(clean)} excluded because they filed a new report after the "
                  f"production run (expected to differ)")
              say(f"  of the remaining {len(clean)}: {len(exact)} reproduce production EXACTLY on all "
                  f"{len(PILLARS) + len(COMPARE)} compared figures ({len(exact) / max(len(clean), 1):.1%})")
              qm = clean[[not same(a, b) for a, b in zip(clean["prod_quality"], clean["replay_quality"])]]
              say(f"  quality score differs for {len(qm)} of {len(clean)}")
              if len(clean) - len(exact):
                  say("  differing companies (up to 25):")
                  for _, r in clean[clean["fields_differing"] != ""].head(25).iterrows():
                      say(f"    {r['ticker']:6s} quality prod {r['prod_quality']} vs replay {r['replay_quality']} | "
                          f"differs: {r['fields_differing']}")
          except Exception as e:                    # a broken self-check is reported, never fatal to the data
              say(f"  VALIDATION COULD NOT RUN: {type(e).__name__}: {str(e)[:200]}")

          say(f"\ntotal run time {(time.time() - t0) / 60:.1f} min")
          (OUT / "pit_report.txt").write_text("\n".join(report) + "\n")
          if partial:
              sys.exit("Replay hit its time limit; partial results were saved.")
          PITRUN
          python build_pit_quality.py

      - name: Say where the download is, and what each check found
        if: always()
        shell: bash
        run: |
          {
            echo "## Download the data for Claude"
            echo "Scroll down this page to **Artifacts** and click **quality-history**."
            echo "Upload that zip to Claude -- the zip, not this log."
            echo ""
            echo "## What each check found"
            echo '```'
            echo "[2] replay checks:      $(grep -h 'checks pass against real filings' backtest_data/replay_output.txt 2>/dev/null | tail -1 | sed 's/^ *//' || true)"
            grep -h -A2 'NOT CHECKED' backtest_data/replay_output.txt 2>/dev/null | sed 's/^/                          /' | head -3 || true
            echo "[3] unit tests:         $(grep -h 'behaved as they should' backtest_data/unit_tests_output.txt 2>/dev/null | tail -1 || true)"
            echo "[4] refresh vs nightly: $(grep -h '^RESULT' backtest_data/z_consistency_report.txt 2>/dev/null | cut -c1-150 || true)"
            echo "[5] replay vs today:    $(grep -h 'reproduce production EXACTLY' backtest_data/pit_report.txt 2>/dev/null | sed 's/^ *//' || true)"
            echo "                        $(grep -h 'quality score differs' backtest_data/pit_report.txt 2>/dev/null | sed 's/^ *//' || true)"
            grep -h 'PARTIAL' backtest_data/pit_report.txt 2>/dev/null | sed 's/^/                        /' || true
            echo '```'
            echo ""
            echo "Steps that show a red cross above did not finish; the others are unaffected."
            echo ""
            echo "Files in the download:"
            echo '```'
            ls -la backtest_data 2>/dev/null || echo "(nothing was written)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload everything as one artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-history
          path: backtest_data/
          retention-days: 30
          if-no-files-found: error
