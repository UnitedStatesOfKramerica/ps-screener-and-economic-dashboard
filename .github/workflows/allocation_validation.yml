name: Allocation validation (one-off)

# Manual-trigger only. Runs allocation_validation.py once and captures its
# output in the Actions log. Delete this file and allocation_validation.py
# once we've read the output. NOTE: this script imports market_check_backtest
# (for its validated allocation_at) and historical_check, so all three plus
# macro_dashboard must be present in the repo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests xlrd yfinance openpyxl

      - name: Run allocation validation
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python allocation_validation.py
