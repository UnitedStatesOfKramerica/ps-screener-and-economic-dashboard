name: Historical check

# Run manually from the Actions tab. Prints its report to the build log --
# it does not publish anything. Copy the log output back for interpretation.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Same packages as the nightly dashboard build. With requests alone, the
      # 18 Sept run silently skipped SPY/RSP (needs yfinance) and margin debt
      # (needs openpyxl), so every result depending on them was incomplete.
      - run: pip install requests xlrd yfinance openpyxl

      - name: Run historical check
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python historical_check.py
